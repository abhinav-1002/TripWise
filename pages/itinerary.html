<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TripWise - Itinerary</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>


<body>

    <!-- ================= Header ================= -->

    <header class="navbar">

        <div class="container navbar-content">

            <a href="../index.html" class="logo">
                Trip<span>Wise</span>
            </a>

            <nav class="nav-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="itinerary.html" class="active">
                    Itinerary
                </a>

                <a href="expenses.html">
                    Split It
                </a>

            </nav>

        </div>

    </header>


    <!-- ================= Main ================= -->

    <main>

        <!-- Page Heading -->
        <section class="page-header">
            <div class="container">
                <p class="section-label">
                    PLAN YOUR DAYS
                </p>
                <h1>
                    Trip Itinerary
                </h1>
                <p>
                    Organize your activities and plans day by day.
                </p>
            </div>
        </section>


        <!-- ================= Itinerary Section ================= -->
        <section class="itinerary-section">
            <div class="container">
                <div class="section-heading">
                    <div>
                        <p class="section-label">
                            YOUR ACTIVITIES
                        </p>
                        <h2>
                            Itinerary
                        </h2>
                    </div>
                    <button
                        class="secondary-btn"
                        id="addActivityBtn"
                    >
                        + Add Activity
                    </button>
                </div>


                <!-- ================= Activity Form ================= -->
                <div
                    class="activity-form-container"
                    id="activityFormContainer"
                >
                    <form
                        id="activityForm"
                        class="activity-form"
                    >
                        <h3>
                            Add Activity
                        </h3>
                        <div class="form-group">
                            <label for="activityDay">
                                Day
                            </label>
                            <input
                                type="number"
                                id="activityDay"
                                min="1"
                                placeholder="e.g. 1"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="activityTime">
                                Time
                            </label>
                            <input
                                type="time"
                                id="activityTime"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="activityName">
                                Activity
                            </label>
                            <input
                                type="text"
                                id="activityName"
                                placeholder="e.g. Visit Baga Beach"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="activityLocation">
                                Location
                            </label>
                            <input
                                type="text"
                                id="activityLocation"
                                placeholder="e.g. Baga Beach"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="activityDescription">
                                Description
                            </label>
                            <textarea
                                id="activityDescription"
                                placeholder="Add some details about this activity"
                            ></textarea>
                        </div>

                        <div class="form-buttons">
                            <button
                                type="submit"
                                class="primary-btn"
                            >
                                Add Activity
                            </button>
                            <button
                                type="button"
                                class="secondary-btn"
                                id="cancelActivityBtn"
                            >
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>

                <!-- ================= Activities ================= -->
                <div
                    class="itinerary-container"
                    id="itineraryContainer"
                >
                    <div
                        class="empty-state"
                        id="emptyItinerary"
                    >
                        <h3>
                            No activities yet
                        </h3>
                        <p>
                            Add your first activity to start planning your itinerary.
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </main>


    <!-- ================= Footer ================= -->
    <footer class="footer">
        <div class="container">
            <p>
                &copy; 2026 TripWise. All rights reserved.
            </p>
        </div>
    </footer>


    <script src="../js/helpers/storage.js"></script>
    <script src="../js/itinerary.js"></script>

</body>

</html>
